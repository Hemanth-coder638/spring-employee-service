version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo "Initializing build environment"
      - java -version
      - mvn -version

  pre_build:
    commands:
      - echo "Pre-build checks"
      - chmod +x mvnw || true

  build:
    commands:
      - echo "Running Maven build"
      - mvn clean package -DskipTests

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - target/*.jar
  discard-paths: yes
